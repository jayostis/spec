name: contexts

# Asserts that every published JSON-LD context under contexts/ loads in a
# strict JSON-LD processor. The check's default glob is contexts/**, matching
# the `paths` trigger below: a narrower one would leave a context outside
# contexts/v1/ running this job, passing it, and never being opened.
#
# Without this job nothing in the repository ever passes these files to a
# processor, which is exactly how three of the seven came to be published
# invalid and stay that way: json.load succeeds on all of them, so a JSON
# syntax check -- or an editor, or a linter -- reports them fine. Only
# expansion objects, and nothing expanded them. See issue #48.
#
# Note the `paths` list: it must include contexts/** or the job fires only on
# PRs that edit the check and never on PRs that edit a context, which is
# backwards and is how the other workflows in this repository are currently
# scoped. That is deliberate here, not a copy-paste from term-status.yml.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'contexts/**'
      - 'ontologies/**'
      - 'scripts/check-context-validity.py'
      - 'scripts/test-check-context-validity.sh'
      - 'scripts/check-context-coverage.py'
      - 'scripts/cascade_ontology.py'
      - 'scripts/test-check-context-coverage.sh'
      - 'scripts/requirements.txt'
      - '.github/workflows/contexts.yml'
  workflow_dispatch:

jobs:
  contexts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      # The regression suite runs the check against the repository AND against
      # scratch copies with known defects introduced, so a check that has
      # stopped being able to fail is caught here rather than in a consumer.
      # Control 6 additionally fails if the strict processor is ever swapped
      # for rdflib, which accepts the broken files.
      - name: Regression suite (check + negative controls)
        run: sh scripts/test-check-context-validity.sh

      - name: Every context loads in a strict processor
        run: python3 scripts/check-context-validity.py

  context-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      # A separate job from the validity check above, and separately triggered
      # on ontologies/**, because this rule is about the RELATIONSHIP between
      # two artifacts: every record class must have a published JSON name. A
      # class absent from all seven contexts has none, so a consumer either
      # invents one -- which is how two spellings of a class get into
      # circulation -- or cannot address it. Twelve were in that state.
      #
      # Kept out of check-context-validity.py deliberately: that check needs no
      # ontology and must keep working while the vocabulary is mid-edit.
      - name: Regression suite (check + negative controls)
        run: sh scripts/test-check-context-coverage.sh

      - name: Every record class has a published JSON name
        run: python3 scripts/check-context-coverage.py
