name: shapes

# Two structural rules about this repository's own SHACL, enforced on every
# change to a vocabulary or its shapes. Neither can see the other's defect, so
# they are separate jobs.
#
#  1. ENTAILMENT INDEPENDENCE (validation/index.md): no shape published here may
#     depend on RDFS entailment to reach the classes it constrains. Without this
#     job the rule is only a document, and the gap it forbids has already been
#     authored twice.
#
#  2. NESTED-SHAPE SEVERITY: no shape reached by sh:node or sh:qualifiedValueShape
#     may carry a constraint softer than sh:Violation, because SHACL conformance
#     is an EMPTY result set and a nested sh:Warning is therefore re-reported as
#     a Violation on the referring shape. clinical v1.16 shipped that defect on
#     six document classes; clinical v1.17 fixed it and added the check.
#
#  3. RECORD-CLASS SHAPE COVERAGE: a class carrying `a cascade:RecordClass`
#     holds record data, so some shape must name it in sh:targetClass. Without
#     that, SHACL reports conforms:true over its records having examined nothing
#     -- a verdict indistinguishable from an earned one.
#     check-shape-targets.py reports PASS straight over this by design: its T
#     assertion fires only for a superclass some shape already targets.
#     clinical:CoverageRecord lived its whole life unshaped; clinical v1.18
#     shaped it and added this check. Through core v3.12 the check keyed on
#     rdfs:subClassOf prov:Entity; jayostis/spec#34 ruled that reading out (the
#     axiom is PROV-O alignment) and core v3.13 moved it onto the marker.
#
#  4. RECORD-CLASS REGISTRY AGREEMENT: pod-structure.md registers classes with
#     solid:forClass, which says a Pod stores them -- the same claim the marker
#     makes. The two must agree. An explicit list's failure mode is silent
#     omission, and a second independently maintained enumeration is what
#     catches it.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'ontologies/**'
      - 'scripts/check-shape-targets.py'
      - 'scripts/test-check-shape-targets.sh'
      - 'scripts/check-nested-severity.py'
      - 'scripts/test-check-nested-severity.sh'
      - 'scripts/known-severity-escalations.json'
      - 'scripts/check-class-coverage.py'
      - 'scripts/test-check-class-coverage.sh'
      - 'scripts/test-record-class-declarations.sh'
      - 'scripts/known-unshaped-classes.json'
      - 'scripts/check-record-class-registry.py'
      - 'scripts/test-check-record-class-registry.sh'
      - 'scripts/cascade_ontology.py'
      - 'pod-structure.md'
      - 'scripts/requirements.txt'
      - '.github/workflows/shapes.yml'
  workflow_dispatch:

jobs:
  entailment-independence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      # The regression suite runs the check against the repository AND against
      # scratch copies with known violations reintroduced, so a check that has
      # stopped being able to fail is caught here rather than in a consumer.
      - name: Regression suite (check + negative controls)
        run: sh scripts/test-check-shape-targets.sh

      - name: Entailment-independence check
        run: python3 scripts/check-shape-targets.py

  nested-shape-severity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      # Negative controls reintroduce the clinical v1.16 authoring into a scratch
      # copy and require a named failure, and they test the baseline in BOTH
      # directions: a new site must fail, and a baselined site that has been
      # fixed must fail too, so the list cannot silently re-absorb it.
      - name: Regression suite (check + negative controls)
        run: sh scripts/test-check-nested-severity.sh

      - name: Nested-shape severity check
        run: python3 scripts/check-nested-severity.py

  record-class-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      # The defining negative control removes the shape clinical v1.18 added and
      # requires the check to name clinical:CoverageRecord, which is the only
      # assertion proving it would have caught the live defect. The baseline is
      # tested in BOTH directions: a newly unshaped class must fail, and a
      # baselined class that has since been shaped must fail too.
      - name: Regression suite (check + negative controls)
        run: sh scripts/test-check-class-coverage.sh

      # The suite above asks whether the CHECK can still fail. This one asks
      # whether the VOCABULARY still says something true about itself: a class
      # carrying its own data properties is record data and must declare the
      # PROV superclass that says so, or the gate cannot see it at all -- it
      # reports PASS over the class while the baseline, being the gate's
      # output, does not list it either. Seven classes were invisible in both
      # directions that way, two of them reported by conformance for months.
      # It also pins the population count, so widening the check's scope over
      # the 43 value enumerations fails here rather than shipping.
      - name: Record-class declaration suite
        run: sh scripts/test-record-class-declarations.sh

      - name: Record-class shape coverage check
        run: python3 scripts/check-class-coverage.py

  record-class-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python3 -m pip install -r scripts/requirements.txt

      # pod-structure.md and the ontologies are two independently maintained
      # enumerations of the same fact: which classes a Pod stores. Comparing
      # them catches the omission neither catches alone -- a class added to the
      # vocabulary and the pod layout that nobody marked, which is
      # indistinguishable from a considered exclusion unless something else
      # knows. The negative controls break the agreement in BOTH directions and
      # require a named failure, and one asserts that an empty pod-structure.md
      # fails rather than passing vacuously.
      - name: Regression suite (check + negative controls)
        run: sh scripts/test-check-record-class-registry.sh

      - name: Record-class registry agreement check
        run: python3 scripts/check-record-class-registry.py
